<body>

<br><br>

<center><h1><p style="width: 780px">SCORE EVALUATION<p></h1>
<details ontoggle="guide()">
        <summary style="font-family: monospace; color: lightslategray; width: 300px">Click here:</summary>
        <i id="show">
        </i>
</details>

<br><br>

<div class="container">
<div class="row">
	<div class="col-md-4">
		<img src="https://i.pinimg.com/736x/46/eb/e7/46ebe7ad05c223bc4563cc51ea3515aa.jpg">
<br><br>
                <p style="height: 28px">MATHEMATICS</p>
		<input type="number" class="form-control" placeholder="Enter..." id="science">
	</div>
	<div class="col-md-4">
		<img src="https://i.pinimg.com/736x/04/5d/90/045d908a0e5e50f7e858803dc9b5dbeb.jpg">
<br><br>
                <p style="height: 28px">SCIENCE</p>
	        <input type="number" class="form-control" placeholder="Enter..." id="math">
	</div>
	<div class="col-md-4">
		<img src="https://i.pinimg.com/736x/e7/c4/30/e7c430bd88fbb668455ddc943e0e2357.jpg">
<br><br>
                <p style="height: 28px">SOCIAL STUDIES</p>
		<input type="number" class="form-control" placeholder="Enter..." id="ss">
	</div>
</div>
</div>

<br>

<button type="Submit" class="btn btn-light" onclick="grades()">Evaluate grades</button>

<br><br>

<kbd id="show_here" style="color: lightskyblue; background-color: lightslategray;">Analysis</kbd>
</center>

<script>

function grades(){
	let sci = Number(document.getElementById("science").value);
	let math = Number(document.getElementById("math").value);
	let ss = Number(document.getElementById("ss").value);
	let average = ((sci + math + ss)/3).toFixed(2);
	
switch(true){
      case(average >= 70 && average <= 74.99):
	grade = "Your average seems to be poor.";
break;

      case(average >= 75 && average <= 79.99):
	grade = "Your average seems to need improvement.";
break;

      case(average >= 80 && average <= 86.99):
	grade = "Your average seems to be satisfactory.";
break;

      case(average >= 87 && average <= 93.99):
	grade = "Your average is above satisfactory.";
break;

      case(average >= 94 && average <= 100):
	grade = "Your average is excellent.";
break;
	}

	document.getElementById("show_here").innerText = grade;
        }

      function guide (){
        document.getElementById("show").innerHTML = "Enter your grade, then click 'EVALUATE GRADE' to see your rating.";
      }
</script>
